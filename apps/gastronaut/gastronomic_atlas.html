<title>Гастрономічний Атлас</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Spectral:wght@500;700&display=swap">
<style>
/* Layout: заголовок → вкладки сцен → фільтри → 3D-сцена → дві колонки (довідка/картка продукту | меню з правилами SUBIT).
   Палітра: холодний «препаратний» сланець + чотири семантичні орбіти P1–P3+. */
:root{
  --bg:#e7edef; --panel:#f7fafb; --canvas:#f1f6f7; --ink:#13232b; --muted:#566a73; --line:#c5d2d8;
  --accent:#0a6a84; --accent-soft:#d3eaf1; --on-accent:#ffffff;
  --o1:#2c8a4e; --o2:#b98a0c; --o3:#d2691b; --o4:#c13a3a; --belB:#7a5cc0;
  --display:"Spectral",Georgia,"Times New Roman",serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1418; --panel:#111d23; --canvas:#0e191e; --ink:#e3eef1; --muted:#8ba2ab; --line:#233740;
    --accent:#62c6dd; --accent-soft:#143441; --on-accent:#05212a;
    --o1:#58c27a; --o2:#e6bb3c; --o3:#f08f3f; --o4:#f26d6d; --belB:#a58cf0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1418; --panel:#111d23; --canvas:#0e191e; --ink:#e3eef1; --muted:#8ba2ab; --line:#233740;
  --accent:#62c6dd; --accent-soft:#143441; --on-accent:#05212a;
  --o1:#58c27a; --o2:#e6bb3c; --o3:#f08f3f; --o4:#f26d6d; --belB:#a58cf0;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--body);
  padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.eyebrow{font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:700 clamp(28px,5vw,40px)/1.05 var(--display);margin:6px 0 4px;text-wrap:balance}
.lede{margin:0;color:var(--muted);max-width:68ch}
h2{font:700 19px/1.2 var(--display);margin:0 0 6px;text-wrap:balance}
h3{font:600 14px/1.3 var(--body);margin:0}
button,select,input{font:inherit;color:var(--ink)}
button:focus-visible,select:focus-visible,input:focus-visible,canvas:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters input[type=search]{flex:1 1 220px;min-width:0;height:38px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.filters select{height:38px;min-width:0;max-width:100%;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.orbits{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer}
.chip .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.chip[aria-pressed="false"]{opacity:.45}
.chip b{font-family:var(--mono);font-weight:500}
.stage{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 40%,var(--panel),var(--canvas))}
canvas#cv{display:block;width:100%;height:min(64vh,580px);min-height:380px;touch-action:none;cursor:grab}
canvas#cv.grabbing{cursor:grabbing}
.ov{position:absolute;right:10px;top:10px;display:flex;gap:6px}
.ov button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer}
.ov button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.badge{position:absolute;left:10px;top:10px;font:500 12px var(--mono);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.hint{position:absolute;left:10px;bottom:10px;right:10px;font-size:12px;color:var(--muted);pointer-events:none}
.hint span{background:color-mix(in srgb,var(--panel) 88%,transparent);padding:3px 8px;border-radius:8px;display:inline-block}
.tip{position:absolute;display:none;pointer-events:none;font:12px var(--mono);background:var(--ink);color:var(--panel);padding:4px 8px;border-radius:6px;white-space:nowrap;transform:translate(12px,-50%);z-index:3}
.cols{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:760px){.cols{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.panel p{margin:0 0 8px}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 14px;font-size:13px}
.kv b{font-weight:600;color:var(--muted)}
.legend{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;font-size:13px;margin:8px 0}
.legend b{font-family:var(--mono);font-weight:500}
.food{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.foodHead{display:flex;gap:12px;align-items:center}
.foodHead .big{font-size:38px;line-height:1}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font:500 12px var(--mono);color:#fff}
.pill.o1{background:var(--o1)}.pill.o2{background:var(--o2)}.pill.o3{background:var(--o3)}.pill.o4{background:var(--o4)}
:root:not([data-theme="dark"]) .pill.o2{color:#fff}
.mac{display:grid;grid-template-columns:70px minmax(0,1fr) 64px;gap:4px 8px;align-items:center;font-size:12.5px;margin:10px 0}
.mac .tr{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.mac .tr i{display:block;height:100%;background:var(--accent)}
.mac span:last-child{text-align:right;font-family:var(--mono)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.tags span{border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:12px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{padding:3px 9px;font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.found{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.found button{border:1px solid var(--line);background:transparent;border-radius:6px;padding:2px 8px;font-size:12px;cursor:pointer}
.plist{display:flex;flex-direction:column;gap:5px;margin:8px 0}
.pitem{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:13px}
.pitem span{min-width:0;overflow-wrap:anywhere}
.pitem small{color:var(--muted);font-family:var(--mono)}
.sform{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0;font:12.5px/1.45 var(--mono);overflow-wrap:anywhere}
.bel{display:flex;gap:12px;align-items:center}
.bel svg{width:132px;height:auto;flex:0 0 auto}
.fx{display:flex;flex-direction:column;gap:5px;margin:8px 0}
.fx div{display:flex;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12.5px}
.fx .pen b{color:var(--o4)}.fx .bon b{color:var(--o1)}
.fx b{font-family:var(--mono);font-weight:500;white-space:nowrap}
details{margin-top:6px}
summary{cursor:pointer;font-weight:600}
.tests{display:flex;flex-direction:column;gap:3px;margin-top:6px;font-size:12.5px}
.tests div{display:flex;justify-content:space-between;gap:8px}
.ok{color:var(--o1)}.bad{color:var(--o4)}
textarea#exportTxt{width:100%;height:90px;margin-top:6px;font:12px var(--mono);background:var(--canvas);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px}
.nut{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px;margin:8px 0}
.nut .nr{display:grid;grid-template-columns:62px minmax(0,1fr) 34px;gap:6px;align-items:center;font-size:12px}
.nut .tr{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.nut .tr i{display:block;height:100%;background:var(--o1)}
.nut .tr i.min{background:var(--belB)}
.nut .nr span:last-child{text-align:right;font-family:var(--mono)}
.nut h4{grid-column:1/-1;margin:6px 0 0;font:600 12px var(--body);color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
@media (max-width:480px){.nut{grid-template-columns:minmax(0,1fr)}}
.axes label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.gin{width:64px;height:28px;border:1px solid var(--line);border-radius:6px;background:var(--canvas);padding:0 6px;font:12px var(--mono)}
.pitem .gw{display:flex;align-items:center;gap:4px;flex:0 0 auto;font-size:12px;color:var(--muted)}
.mt{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:8px 0}
.mt div{border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12px;color:var(--muted)}
.mt b{display:block;font:500 15px var(--mono);color:var(--ink)}
.cmpw{overflow-x:auto;margin:8px 0}
.cmp{width:100%;border-collapse:collapse;font-size:12.5px}
.cmp td{padding:3px 6px;border-bottom:1px solid var(--line);font-family:var(--mono)}
.cmp td:nth-child(2){color:var(--muted);text-align:center;font-family:var(--body)}
.cmp td:first-child{text-align:right}
.cmp .w{font-weight:600;color:var(--accent)}
.cmp th{font:600 13px var(--body);padding:4px 6px;text-align:center}
.cmpbox{border:1px solid var(--o3);border-radius:10px;padding:10px 12px;margin-top:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:8px;font-size:13px;z-index:20}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow">3D-карта · орбіти SUBIT</div>
    <h1>Гастрономічний Атлас</h1>
    <p class="lede">Кожна точка — продукт або страва. Положення показує час у шлунку (Max_D), загальний час із поправками моделі, макроелементи або кухню. Колір — орбіта: P1, P2, P3, P3+.</p>

    <div class="tip" id="tip"></div>
    <div class="hint"><span id="hint"></span></div>
  </div>

  <div class="cols">
    <section class="panel" id="info" aria-live="polite"></section>
    <section class="panel" id="menu"></section>
  </div>
  <section class="panel" id="about"></section>
</div>
<div class="toast" id="toast" hidden></div>

/* ================= Розкладки у 3D (x,y,z ∈ приблизно [-1.1, 1.1]) ================= */
const YMIN=-0.9, YSPAN=1.8;
const yTotal = t => YMIN + YSPAN*t/420;          // висота за total (0–420)
const ySt    = s => YMIN + YSPAN*s/240;          // висота за Max_D (0–240)
const rSt    = s => 0.16 + 0.92*s/240;           // радіус за Max_D

// 1. Орбіти: радіус = Max_D, висота = total, сектор = категорія
const L1 = new Array(N);
const SECT = (()=>{
  const cnt = CATS.map(c=>IT.filter(x=>x.c===c).length);
  const w = cnt.map(n=>Math.pow(Math.max(n,1),0.75)), sw = w.reduce((a,b)=>a+b,0);
  const gap = 0.10, room = 2*Math.PI - gap*CATS.length;
  let a=0; return CATS.map((c,i)=>{ const s={a0:a,a1:a+w[i]/sw*room,count:cnt[i]}; a=s.a1+gap; return s; });
})();
(function(){
  const seen = CATS.map(()=>0);
  IT.forEach(it=>{
    const ci = CATS.indexOf(it.c), k = seen[ci]++, sec = SECT[ci];
    const ang = sec.a0 + (((k+1)*0.61803398875)%1)*(sec.a1-sec.a0);
    const r = rSt(it.s) + (r01(it.id,'r')-0.5)*0.045;
    const y = yTotal(it.t) + (r01(it.id,'y')-0.5)*0.02;
    L1[it.i] = [Math.cos(ang)*r, y, Math.sin(ang)*r];
  });
})();

// 2. Макро-куб: x = жири, y = вуглеводи, z = білки; шкала √, щоб не збиватися у кут
const MX = {f:Math.max(...IT.map(x=>x.f)), h:Math.max(...IT.map(x=>x.h)), p:Math.max(...IT.map(x=>x.p))};
const sq = (v,m) => 2*Math.sqrt(Math.max(0,v)/m)-1;
const L2 = IT.map(it=>[sq(it.f,MX.f)*0.95, sq(it.h,MX.h)*0.95, sq(it.p,MX.p)*0.95]);

// 4. Вітаміни й мінерали: три довільні осі, шкала √
const L4 = new Array(N).fill(null).map(()=>[0,0,0]);
const NAX = {x:0,y:1,z:8};
const nMax = j => Math.max(1,...IT.map(x=>x.v[j]));
function buildL4(){
  const m=[nMax(NAX.x),nMax(NAX.y),nMax(NAX.z)];
  IT.forEach(it=>{ const a=L4[it.i]; a[0]=sq(it.v[NAX.x],m[0])*0.95; a[1]=sq(it.v[NAX.y],m[1])*0.95; a[2]=sq(it.v[NAX.z],m[2])*0.95; });
}
// 3. Кухні: колони по колу, від найлегшої середньої Max_D до найважчої
const CU = (()=>{
  const m = new Map();
  IT.forEach(it=>{ const o=m.get(it.k)||{k:it.k,n:0,sum:0}; o.n++; o.sum+=it.s; m.set(it.k,o); });
  const arr=[...m.values()].map(o=>({...o,avg:o.sum/o.n})).sort((a,b)=>a.avg-b.avg);
  arr.forEach((o,i)=>{ o.ang = i/arr.length*2*Math.PI; });
  return arr;
})();
const CUIDX = new Map(CU.map(o=>[o.k,o]));
const CR = 1.0;
const L3 = IT.map(it=>{
  const c = CUIDX.get(it.k), a=r01(it.id,'a')*2*Math.PI, d=0.07*Math.sqrt(r01(it.id,'d'));
  return [Math.cos(c.ang)*CR + Math.cos(a)*d, ySt(it.s) + (r01(it.id,'v')-0.5)*0.015, Math.sin(c.ang)*CR + Math.sin(a)*d];
});

function analyze(){
  if (!plate.length) return {empty:true,max:0,total:0,pen:[],bon:[],penT:0,bonT:0,orbit:-1,bel:{code:'A4',label:'NONE',cls:'N',desc:'Немає даних — порожнє меню'},maxItem:-1};
  const its = plate.map(i=>IT[i]);
  const hasT = t => its.some(x=>x.tg.includes(t));
  const withT = (...ts) => its.filter(x=>ts.some(t=>x.tg.includes(t))).map(x=>x.i);
  const maxItem = its.reduce((a,b)=>b.s>a.s?b:a, its[0]);
  const max = maxItem.s;
  const pen = [];
  if (hasT('meat') && hasT('dairy')) pen.push({code:'MEAT_DAIRY', short:'М’ясо + молочне', text:'М’ясо + молочне', time:50, trig:withT('meat','dairy')});
  if (hasT('meat') && hasT('fruit')) pen.push({code:'MEAT_FRUIT', short:'М’ясо + фрукти', text:'М’ясо + фрукти', time:40, trig:withT('meat','fruit')});
  if (its.filter(x=>x.tg.includes('fat')).length>=2 || (hasT('fat') && hasT('sweet'))) pen.push({code:'FAT_SWEET', short:'Жир + цукор', text:'Жир + цукор', time:50, trig:withT('fat','sweet')});
  if (hasT('cold') && hasT('fat')) pen.push({code:'COLD_FAT', short:'Холодне + жирне', text:'Холодне + жирне', time:40, trig:withT('cold','fat')});
  const reds = its.filter(x=>x.o===3);
  if (reds.length>=2) pen.push({code:'2_RED', short:'≥2 важких (P3+)', text:'Щонайменше два продукти з P3+', time:60, trig:reds.map(x=>x.i)});
  const bon = [];
  if (walk) bon.push({code:'WALK', short:'Прогулянка', text:'Прогулянка (−25% від Max_D)', time:Math.round(max*0.25), trig:[maxItem.i]});
  const fer = its.filter(x=>x.fe);
  if (fer.length) bon.push({code:'FERMENTED', short:'Ферментоване', text:'Ферментований продукт', time:15, trig:fer.map(x=>x.i)});
  const penT = pen.reduce((s,x)=>s+x.time,0), bonT = bon.reduce((s,x)=>s+x.time,0);
  const total = Math.max(0, max+penT-bonT);
  let bel;
  if (!pen.length && !bon.length) bel={code:'A1',label:'TRUE',cls:'T',desc:'Є докази сумісності, штрафів немає'};
  else if (pen.length && !bon.length) bel={code:'A2',label:'FALSE',cls:'F',desc:'Є докази несумісності, лише штрафи'};
  else if (pen.length && bon.length) bel={code:'A3',label:'BOTH',cls:'B',desc:'Конфлікт: штрафи й бонуси одночасно'};
  else bel={code:'A1',label:'TRUE',cls:'T',desc:'Сумісне, є бонуси'};
  return {empty:false,max,total,pen,bon,penT,bonT,orbit:orbitIdx(total),bel,maxItem:maxItem.i};
}

function applyFilter(){

  matchCount = 0;
  for (const it of IT){
    let ok = fOrb[it.o];
    if (ok && fCuisine!=='ALL') ok = it.k===fCuisine;

    if (ok && q) ok = it.hay.includes(q);
    match[it.i] = ok?1:0; if (ok) matchCount++;
  }

  renderOrbitChips(); renderInfo();
}

const C = $('cv'), ctx = C.getContext('2d'), TIP = $('tip');
let W=0, H=0;
function resize(){
  const r = C.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio||1, 2.5);
  C.width = Math.round(r.width*dpr); C.height = Math.round(r.height*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0); W=r.width; H=r.height;

const _p = {x:0,y:0,z:0,k:1};
function proj(x,y,z,o){
  o = o||_p;
  const cy=Math.cos(V.yaw), sy=Math.sin(V.yaw);
  const x1=cy*x+sy*z, z1=-sy*x+cy*z;
  const cp=Math.cos(V.pitch), sp=Math.sin(V.pitch);
  const y1=cp*y-sp*z1, z2=sp*y+cp*z1;
  const k=4.2/(4.2-z2), sc=Math.min(W,H)*0.34*V.zoom*k;
  o.x=W/2+x1*sc; o.y=H/2-y1*sc; o.z=z2; o.k=k; return o;
}
const PAL = {};
const PAL_KEYS = ['ink','muted','line','accent','o1','o2','o3','o4','belB','panel'];
function refreshPal(){
  const cs = getComputedStyle(document.documentElement);
  PAL_KEYS.forEach(k=>{ PAL[k] = cs.getPropertyValue('--'+k).trim() || '#888'; });
  PAL.o = [PAL.o1,PAL.o2,PAL.o3,PAL.o4];
}
const col = c => PAL[c] || c;
function ring(r,y,color,w,dash,alpha,n){
  n=n||72; const out=[];
  for (let i=0;i<n;i++){
    const a=i/n*2*Math.PI, b=(i+1)/n*2*Math.PI;
    out.push({a:[Math.cos(a)*r,y,Math.sin(a)*r], b:[Math.cos(b)*r,y,Math.sin(b)*r], c:color, w, dash, alpha});
  }
  return out;
}

const SCENE_LAYOUT = {orbit:L1, menu:L1, macro:L2, cuisine:L3, nutri:L4};

/* ---- Додаткові вузли сцени «Меню»: ядро S(τ), правила, зв’язки ---- */
let extrasKey='', EXTRA = {nodes:[], edges:[]};
function buildExtras(){
  const key = plate.join(',')+'|'+walk;
  if (key===extrasKey) return EXTRA; extrasKey=key;
  const nodes=[], edges=[];
  if (!AN.empty){
    const cy = clamp(yTotal(AN.total), YMIN, 0.95);
    nodes.push({id:'core', p:[0,cy,0], r:13, color:'o'+(AN.orbit), orbit:AN.orbit, label:'S(τ) '+AN.total+'′', tip:'S(τ) = '+AN.max+' + '+AN.penT+' − '+AN.bonT+' = '+AN.total+' хв · '+ORB[AN.orbit].k});
    const rules = [...AN.pen.map(x=>({...x,kind:'pen'})), ...AN.bon.map(x=>({...x,kind:'bon'}))];
    rules.forEach((r,i)=>{
      const a = i/Math.max(rules.length,1)*2*Math.PI + 0.6;
      const p=[Math.cos(a)*0.42, cy+(r.kind==='pen'?0.14:-0.14), Math.sin(a)*0.42];
      nodes.push({id:'rule:'+r.code, p, r:7, kind:r.kind, label:(r.kind==='pen'?'+':'−')+r.time+'′ '+r.short, tip:r.text+' ('+(r.kind==='pen'?'+':'−')+r.time+' хв, гіпотеза)'});
      edges.push({a:p, b:[0,cy,0], c:r.kind==='pen'?'o4':'o1', w:1.4, alpha:0.8});
      r.trig.filter(i=>plate.includes(i)).forEach(i=>edges.push({a:p, b:L1[i], c:r.kind==='pen'?'o4':'o1', w:1.1, dash:[4,3], alpha:0.7}));
    });
    plate.forEach(i=>{
      const isMax = i===AN.maxItem;
      edges.push({a:L1[i], b:[0,cy,0], c:isMax?'accent':'muted', w:isMax?2.6:1, dash:isMax?null:[3,4], alpha:isMax?1:0.6});
    });
  }
  EXTRA={nodes,edges}; return EXTRA;
}

/* ---- Селекційні напрямні ---- */
function guides(i, pos){
  const x=pos[0], y=pos[1], z=pos[2], out=[];
  if (scene==='orbit' || scene==='menu'){
    out.push({a:[x,y,z], b:[x,YMIN,z]}, {a:[0,YMIN,0], b:[x,YMIN,z]});
  } else if (scene==='macro'){
    out.push({a:[x,y,z], b:[x,-1,z]}, {a:[x,y,z], b:[-1,y,z]}, {a:[x,y,z], b:[x,y,-1]});
  } else {
    out.push({a:[x,y,z], b:[x,YMIN,z]});
  }
  return out;
}

/* ---- Перехід між розкладками ---- */
const CUR = new Float32Array(N*3);
let FROM = new Float32Array(N*3), TO = L1;
let tweenT0 = 0, tweenDur = 0, staticAlphaT0 = 0;
function setLayout(name, now){
  FROM = Float32Array.from(CUR);
  TO = SCENE_LAYOUT[name];
  tweenT0 = now||performance.now(); tweenDur = reduceMotion?0:750; staticAlphaT0=tweenT0;
}
CUR.set(L1.flat());

/* ---- Кадр ---- */
const sx=new Float32Array(N), sy=new Float32Array(N), sz=new Float32Array(N), sk=new Float32Array(N);
const order = Array.from({length:N},(_,i)=>i);
let hitList = [];
function colorOf(it){ return colorBy==='orbit' ? PAL.o[it.o] : CATCOL[CATS.indexOf(it.c)]; }
function baseR(it){
  const emoji = useEmoji();
  let r = emoji ? 9 : 4.4;
  if (scene==='macro') r *= (0.75+0.75*Math.sqrt(it.cal/607));
  return r*(0.7+0.3*V.zoom);
}
function useEmoji(){ return matchCount<=140 || V.zoom>=1.7; }

function frame(now){
  requestAnimationFrame(frame);
  if (!W || !H) return;
  refreshPal();
  if (!dragging && !pinch){
    if (V.auto) V.yaw += 0.0045;
    V.yaw += V.vy; V.pitch += V.vp; V.vy*=0.92; V.vp*=0.92;
  }
  V.pitch = clamp(V.pitch,-1.5,1.5);
  const tt = tweenDur ? clamp((now-tweenT0)/tweenDur,0,1) : 1;
  const e = tt<0.5 ? 4*tt*tt*tt : 1-Math.pow(-2*tt+2,3)/2;
  for (let i=0;i<N;i++){
    const t = TO[i], j=i*3;
    CUR[j]   = FROM[j]   + (t[0]-FROM[j])*e;
    CUR[j+1] = FROM[j+1] + (t[1]-FROM[j+1])*e;
    CUR[j+2] = FROM[j+2] + (t[2]-FROM[j+2])*e;
  }
  ctx.clearRect(0,0,W,H);
  const st = STATIC[scene], sa = tt;
  const q = {x:0,y:0,z:0,k:1}, q2 = {x:0,y:0,z:0,k:1};
  // статичні лінії
  for (const L of st.lines){
    proj(L.a[0],L.a[1],L.a[2],q); proj(L.b[0],L.b[1],L.b[2],q2);
    ctx.globalAlpha = (L.alpha==null?1:L.alpha)*sa;
    ctx.strokeStyle = col(L.c); ctx.lineWidth = L.w||1; ctx.setLineDash(L.dash||[]);
    ctx.beginPath(); ctx.moveTo(q.x,q.y); ctx.lineTo(q2.x,q2.y); ctx.stroke();
  }
  ctx.setLineDash([]); ctx.globalAlpha=1;
  // проєкція точок
  for (let i=0;i<N;i++){
    proj(CUR[i*3],CUR[i*3+1],CUR[i*3+2],q); sx[i]=q.x; sy[i]=q.y; sz[i]=q.z; sk[i]=q.k;
  }
  // напрямні для вибраного
  if (sel>=0){
    const pos=[CUR[sel*3],CUR[sel*3+1],CUR[sel*3+2]];
    ctx.strokeStyle=PAL.accent; ctx.lineWidth=1.3; ctx.setLineDash([4,4]); ctx.globalAlpha=0.9;
    for (const g of guides(sel,pos)){
      proj(g.a[0],g.a[1],g.a[2],q); proj(g.b[0],g.b[1],g.b[2],q2);
      ctx.beginPath(); ctx.moveTo(q.x,q.y); ctx.lineTo(q2.x,q2.y); ctx.stroke();
    }
    ctx.setLineDash([]); ctx.globalAlpha=1;
  }
  // сцена «Меню»: зв’язки під точками
  const isMenu = scene==='menu';
  let ex=null;
  if (isMenu && tt>=1){
    ex = buildExtras();
    for (const E of ex.edges){
      proj(E.a[0],E.a[1],E.a[2],q); proj(E.b[0],E.b[1],E.b[2],q2);
      ctx.globalAlpha=E.alpha||1; ctx.strokeStyle=col(E.c); ctx.lineWidth=E.w||1; ctx.setLineDash(E.dash||[]);
      ctx.beginPath(); ctx.moveTo(q.x,q.y); ctx.lineTo(q2.x,q2.y); ctx.stroke();
    }
    ctx.setLineDash([]); ctx.globalAlpha=1;
  }
  // точки (далекі першими)
  order.sort((a,b)=>sz[a]-sz[b]);
  const emoji = useEmoji();
  hitList = [];
  const plateSet = new Set(plate);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for (const i of order){
    const it=IT[i], inP = plateSet.has(i);
    let a = match[i] ? 1 : 0.06;
    if (isMenu && !inP) a = Math.min(a, 0.28);
    const fade = clamp(0.72+0.2*sz[i],0.45,1);
    const r = baseR(it)*sk[i]*(inP&&isMenu?1.35:1);
    ctx.globalAlpha = a*fade;
    ctx.beginPath(); ctx.arc(sx[i],sy[i],r,0,6.2832);
    ctx.fillStyle = colorOf(it); ctx.fill();
    if (emoji && a>0.5){
      ctx.font = Math.round(r*1.45)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
      ctx.fillStyle = PAL.ink; ctx.fillText(it.e, sx[i], sy[i]+r*0.06);
    } else if (a>0.5){
      ctx.lineWidth=1; ctx.strokeStyle=PAL.panel; ctx.stroke();
    }
    if (inP){ ctx.globalAlpha=1; ctx.lineWidth=2.2; ctx.strokeStyle=PAL.accent; ctx.beginPath(); ctx.arc(sx[i],sy[i],r+3,0,6.2832); ctx.stroke(); }
    if (match[i]) hitList.push({id:i,x:sx[i],y:sy[i],r:Math.max(9,r+3),z:sz[i]});
  }
  ctx.globalAlpha=1;
  // виділення, наведення, підписи
  const lab = (i,c)=>{
    const it=IT[i]; ctx.font='600 12px "IBM Plex Sans",system-ui,sans-serif'; ctx.textAlign='center';
    const t=it.e+' '+it.n, w=ctx.measureText(t).width+12, x=clamp(sx[i],w/2+4,W-w/2-4), y=sy[i]-baseR(it)*sk[i]-16;
    ctx.fillStyle=PAL.panel; ctx.globalAlpha=0.94; ctx.fillRect(x-w/2,y-10,w,20); ctx.globalAlpha=1;
    ctx.strokeStyle=c; ctx.lineWidth=1.2; ctx.strokeRect(x-w/2,y-10,w,20);
    ctx.fillStyle=PAL.ink; ctx.fillText(t,x,y+1);
  };
  if (hover>=0 && hover!==sel){ ctx.lineWidth=2; ctx.strokeStyle=PAL.ink; ctx.beginPath(); ctx.arc(sx[hover],sy[hover],baseR(IT[hover])*sk[hover]+4,0,6.2832); ctx.stroke(); }
  if (sel>=0){ ctx.lineWidth=2.6; ctx.strokeStyle=PAL.accent; ctx.beginPath(); ctx.arc(sx[sel],sy[sel],baseR(IT[sel])*sk[sel]+6,0,6.2832); ctx.stroke(); lab(sel,PAL.accent); }
  if (cmp>=0){
    ctx.setLineDash([5,4]); ctx.lineWidth=2.2; ctx.strokeStyle=PAL.o3;
    ctx.beginPath(); ctx.arc(sx[cmp],sy[cmp],baseR(IT[cmp])*sk[cmp]+6,0,6.2832); ctx.stroke();
    if (sel>=0 && sel!==cmp){ ctx.beginPath(); ctx.moveTo(sx[cmp],sy[cmp]); ctx.lineTo(sx[sel],sy[sel]); ctx.stroke(); }
    ctx.setLineDash([]); lab(cmp,PAL.o3);
  }
  // додаткові вузли меню
  if (ex){
    for (const n of ex.nodes){
      proj(n.p[0],n.p[1],n.p[2],q);
      const r=n.r*q.k;
      ctx.beginPath();
      if (n.id==='core'){ ctx.arc(q.x,q.y,r,0,6.2832); ctx.fillStyle=PAL.o[n.orbit]; ctx.fill(); ctx.lineWidth=3; ctx.strokeStyle=PAL.ink; ctx.stroke(); }
      else { ctx.moveTo(q.x,q.y-r); ctx.lineTo(q.x+r,q.y); ctx.lineTo(q.x,q.y+r); ctx.lineTo(q.x-r,q.y); ctx.closePath(); ctx.fillStyle=n.kind==='pen'?PAL.o4:PAL.o1; ctx.fill(); ctx.lineWidth=1.5; ctx.strokeStyle=PAL.panel; ctx.stroke(); }
      ctx.font='600 11px "IBM Plex Sans",system-ui,sans-serif'; ctx.textAlign='center'; ctx.fillStyle=PAL.ink;
      ctx.fillText(n.label,q.x,q.y+r+12);
      hitList.push({id:n.id,x:q.x,y:q.y,r:Math.max(10,r+3),z:q.z+9,tip:n.tip});
    }
  }
  // підписи сцени
  for (const T of st.texts){
    if (T.alpha===0) continue;
    proj(T.p[0],T.p[1],T.p[2],q);
    ctx.globalAlpha=(T.alpha==null?1:T.alpha)*sa;
    ctx.font=(T.bold?'600 ':'400 ')+(T.size||12)+'px "IBM Plex Sans",system-ui,sans-serif';
    ctx.fillStyle=col(T.c||'ink'); ctx.textAlign=T.align||'center'; ctx.textBaseline='middle';
    ctx.fillText(T.text,q.x+(T.dx||0),q.y+(T.dy||0));
  }
  ctx.globalAlpha=1;
}

/* ================= Ввід: миша, дотик, клавіатура ================= */
let dragging=false, down=null, last=null, pinch=null;
const ptrs = new Map();
function hit(mx,my){
  let best=null, bd=1e9;
  for (const h of hitList){
    const d=Math.hypot(h.x-mx,h.y-my);
    if (d<h.r && (d<bd-1 || (Math.abs(d-bd)<=1 && h.z>(best?best.z:-9)))){ bd=d; best=h; }
  }
  return best;
}
C.addEventListener('pointerdown',e=>{
  C.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if (ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:V.zoom}; dragging=false; return; }
  dragging=true; down={x:e.clientX,y:e.clientY}; last={x:e.clientX,y:e.clientY};
  C.classList.add('grabbing'); TIP.style.display='none';
});
C.addEventListener('pointermove',e=>{
  if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if (pinch && ptrs.size>=2){ const [a,b]=[...ptrs.values()]; V.zoom=clamp(pinch.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d,0.5,2.8); return; }
  const r=C.getBoundingClientRect();
  if (dragging){
    const dx=e.clientX-last.x, dy=e.clientY-last.y;
    V.yaw+=dx*0.008; V.pitch+=dy*0.008; V.vy=dx*0.008; V.vp=dy*0.008; last={x:e.clientX,y:e.clientY}; return;
  }
  const h=hit(e.clientX-r.left,e.clientY-r.top);
  hover = h && typeof h.id==='number' ? h.id : -1;
  C.style.cursor = h ? 'pointer' : 'grab';
  if (h){
    let t=h.tip;
    if (!t){ const it=IT[h.id]; t=it.e+' '+it.n+' · '+it.s+'′ · total '+it.t+'′ · '+ORB[it.o].k; }
    TIP.textContent=t; TIP.style.display='block'; TIP.style.left=(e.clientX-r.left)+'px'; TIP.style.top=(e.clientY-r.top)+'px';
  } else TIP.style.display='none';
});
function endPtr(e){
  const had = ptrs.delete(e.pointerId);
  if (pinch){ if (ptrs.size<2) pinch=null; dragging=false; C.classList.remove('grabbing'); return; }
  if (!had || !dragging) return;
  dragging=false; C.classList.remove('grabbing');
  if (e.type==='pointerup' && Math.hypot(e.clientX-down.x,e.clientY-down.y)<6){
    const r=C.getBoundingClientRect(), h=hit(e.clientX-r.left,e.clientY-r.top);
    pick(h && typeof h.id==='number' ? h.id : -1);
  }
}
C.addEventListener('pointerup',endPtr); C.addEventListener('pointercancel',endPtr);
C.addEventListener('pointerleave',()=>{ TIP.style.display='none'; hover=-1; });
C.addEventListener('wheel',e=>{ e.preventDefault(); V.zoom=clamp(V.zoom*(e.deltaY<0?1.08:0.92),0.5,2.8); },{passive:false});

  if (k==='ArrowUp'){V.pitch-=0.1;e.preventDefault();}
  if (k==='ArrowDown'){V.pitch+=0.1;e.preventDefault();}
  if (k==='+'||k==='=') V.zoom=Math.min(2.8,V.zoom*1.1);
  if (k==='-'||k==='_') V.zoom=Math.max(0.5,V.zoom/1.1);
  if (k==='Escape'){ sel=-1; cmp=-1; renderInfo(); }
});

  const sum=NUT.map((n,j)=>Math.round(plate.reduce((s,i)=>s+IT[i].v[j]*(grams[i]||100)/100,0)));
  const row=j=>`<div class="nr"><span>${esc(NUT[j].s)}</span><div class="tr"><i class="${NUT[j].g?'min':''}" style="width:${clamp(sum[j],sum[j]?3:0,100)}%"></i></div><span>${sum[j]}</span></div>`;
  return `<div class="nut"><h4>Вітаміни</h4>${NUT.map((n,j)=>n.g?'':row(j)).join('')}<h4>Мінерали</h4>${NUT.map((n,j)=>n.g?row(j):'').join('')}</div>`;
}
function exportText(){
  const a=AN; if (a.empty) return 'Меню порожнє';
  return plate.map(i=>`${IT[i].e} ${IT[i].n} ${grams[i]||100} г — ${IT[i].s} хв`).join('\n')+`\n\nS(τ) = ${a.max} + ${a.penT} − ${a.bonT} = ${a.total} хв · ${ORB[a.orbit].k}\nБелнап ${a.bel.code} ${a.bel.label}`;
}
const PRESETS = {
  light:[['Яблуко Гала',150],['Грецький салат',200],['Кімчі',50]],
  clash:[['Стейк Рібай',200],['Вершки 20%',30],['Диня',150]],
  mixed:[['Стейк Рібай',200],['Вершки 20%',30],['Кефір 1%',200]]
};
function applyPreset(k){
  plate=[]; for (const key in grams) delete grams[key];
  PRESETS[k].forEach(([n,g])=>{ const x=IT.find(y=>y.n===n); if (x){ plate.push(x.i); grams[x.i]=g; } });
  afterPlate();
  if (scene!=='menu') toast('Приклад готовий. Подивіться його у сцені «Меню і правила».');
}

/* ================= Про дані і перевірки ================= */
function renderAbout(){
  const nAdd=IT.filter(x=>x.ad===1).length, nFix=IT.filter(x=>x.ad===2).length, nVer=IT.filter(x=>x.ve).length, nFm=IT.filter(x=>x.fm).length, nNote=IT.filter(x=>x.nt).length;
  const tests=[
    ['ID унікальні', new Set(IT.map(x=>x.id)).size===N],
    ['total ≥ Max_D для кожного продукту', IT.every(x=>x.t>=x.s)],
    ['Калорії = 4·Б + 9·Ж + 4·В + 2·клітковина + 7·алкоголь (±1)', IT.every(x=>Math.abs(Math.round(x.p*4+x.f*9+x.h*4+x.fb*2+x.al*7)-x.cal)<=1)],
    ['Орбіти P1–P3+ покривають усі продукти', IT.every(x=>x.o>=0&&x.o<=3)],
    ['Max_D ≤ 240 хв', IT.every(x=>x.s<=240)],
    ['13 нутрієнтів у діапазоні 0–100 для кожного продукту', IT.every(x=>x.v.length===13&&x.v.every(a=>a>=0&&a<=100))]
  ];
  $('about').innerHTML = `<h2>Про дані</h2>
    <p>Атлас побудовано з каталогу аудиту v3 (${N-nAdd} записів) і моделі SUBIT. Я додав ${nAdd} поширених продуктів і страв (позначені «додано в атласі») та виправив ${nFix} записів, де у файлі стояли значення іншого продукту, наприклад мед чи олія з макроелементами яблука (позначені «значення виправлено»). Час у шлунку, total, здуття та штрафи меню — модельні оцінки, а не результати вимірювань. З ${N-nAdd} записів файлу лише ${nVer} зіставлено з USDA, і то як оцінки; FODMAP відомий для ${nFm}; для ${nNote} записів total виправлено механічною поправкою моделі. Це довідник для дослідження моделі, а не дієтична чи медична порада.</p>
    <details><summary>Перевірка даних (${tests.filter(t=>t[1]).length}/${tests.length})</summary>
      <div class="tests">${tests.map(t=>`<div><span>${esc(t[0])}</span><span class="${t[1]?'ok':'bad'}">${t[1]?'PASS ✓':'FAIL ✗'}</span></div>`).join('')}</div></details>`;
}

/* ================= Події інтерфейсу ================= */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if (b){
    const a=b.dataset.act, i=+b.dataset.i;
    if (a==='plate') togglePlate(i);
    else if (a==='pick'){ sel=i; renderInfo(); }
    else if (a==='clear-sel'){ sel=-1; cmp=-1; renderInfo(); }
    else if (a==='cmp'){ cmp=i; renderInfo(); toast('Оберіть другий продукт: клік по точці або по кнопці'); }
    else if (a==='cmp-clear'){ cmp=-1; renderInfo(); }
    else if (a==='clear-plate'){ plate=[]; afterPlate('Меню очищено'); }
    else if (a==='preset') applyPreset(b.dataset.p);
    else if (a==='copy'){
      const t=exportText();
      const fallback=()=>{ const ta=$('exportTxt'); ta.hidden=false; ta.value=t; ta.focus(); ta.select(); toast('Виділіть і скопіюйте текст вручну'); };
      try{ navigator.clipboard.writeText(t).then(()=>toast('Скопійовано'),fallback); }catch(err){ fallback(); }
    }
    return;
  }
  const c=e.target.closest('[data-orb]');
  if (c){ const k=+c.dataset.orb; fOrb[k]=!fOrb[k]; applyFilter(); }
});
document.addEventListener('change',e=>{
  const t=e.target; if (!t.classList||!t.classList.contains('gin')) return;
  grams[+t.dataset.gi]=clamp(Math.round(+t.value)||100,10,1000); afterPlate();
});
const SCENES_OK=['orbit','macro','cuisine','nutri','menu'];
function goScene(name,fromHash){
  if (!SCENES_OK.includes(name) || name===scene) return;
  scene=name; extrasKey=''; $('axes').hidden = name!=='nutri';
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',String(t.dataset.scene===name)));
  V.zoom=SCENE_ZOOM[name]; setLayout(name,performance.now());
  renderInfo();
  if (!fromHash){ try{ location.hash=name; }catch(err){} }
}
$('tabs').addEventListener('click',e=>{ const b=e.target.closest('.tab'); if (b) goScene(b.dataset.scene); });
window.addEventListener('hashchange',()=>goScene(location.hash.replace('#',''),true));
let qT=0;
$('q').addEventListener('input',e=>{ clearTimeout(qT); qT=setTimeout(()=>{ fQ=e.target.value; applyFilter(); },120); });
$('fCuisine').addEventListener('change',e=>{ fCuisine=e.target.value; applyFilter(); });
$('fCat').addEventListener('change',e=>{ fCat=e.target.value; applyFilter(); });
$('fNut').addEventListener('change',e=>{ fNut=e.target.value; applyFilter(); });
['nx','ny','nz'].forEach((id,a)=>$(id).addEventListener('change',e=>{
  NAX[['x','y','z'][a]]=+e.target.value; buildL4(); STATIC.nutri=nutriStatic();
  if (scene==='nutri'){ setLayout('nutri',performance.now()); renderInfo(); }
}));
$('fColor').addEventListener('change',e=>{ colorBy=e.target.value; });
window.addEventListener('resize',resize);

/* ================= Запуск ================= */
$('eyebrow').textContent='3D-карта · '+N+' продуктів і страв · орбіти SUBIT';
buildFilters(); loadPlate(); AN=analyze();
resize(); applyFilter(); renderMenu(); renderAbout();
requestAnimationFrame(frame);
goScene(location.hash.replace('#',''),true);
})();
</script>
